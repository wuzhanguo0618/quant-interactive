<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>如果回到 2020｜2020 疫情</title>
<style>:root{
  --paper:#FBFAF7;
  --ink:#14181C;
  --muted:#6E757D;
  --line:rgba(20,24,28,.10);
  --accent:#0B6E4F;
  --up:#B3261E;
  --down:#0B6E4F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 48px}

/* 头部 */
.head{padding-bottom:16px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.head h1{
  margin:10px 0 6px;font-size:38px;font-weight:600;letter-spacing:-.01em;
  font-family:"Songti SC","Source Han Serif SC",serif;
}
.sub{margin:0;font-size:13px;color:var(--muted)}

/* 图表 */
.chart-card{margin:20px 0 24px;padding:14px 14px 12px;border:1px solid var(--line);background:#fff}
.chart-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.chart{width:100%}
.chart svg{display:block;width:100%;height:auto}
.chart-note{font-size:10.5px;color:var(--muted);margin-top:6px}

/* 答题 */
.progress{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.04em}
.ask{font-size:21px;font-weight:600;margin:10px 0 6px;font-family:"Songti SC","Source Han Serif SC",serif}
.hint{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{
  appearance:none;border:1px solid var(--ink);background:#fff;color:var(--ink);
  padding:14px 6px;font-size:15px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:background .12s ease,color .12s ease;
}
.opt:hover{background:var(--ink);color:var(--paper)}
.opt:disabled{opacity:.5;cursor:default}
.feedback{margin-top:14px;font-size:14px;font-weight:600;min-height:22px}
.up{color:var(--up)}
.down{color:var(--down)}

/* 成绩单 */
.result{margin-top:8px;padding:22px 18px;border:1px solid var(--ink);background:#fff}
.r-kicker{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.r-nav{
  font-size:64px;font-weight:600;line-height:1.1;margin:8px 0 2px;
  font-family:"Songti SC","Source Han Serif SC",serif;
  font-variant-numeric:tabular-nums;
}
.r-sub{font-size:12px;color:var(--muted)}
.rows{margin:18px 0 16px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.rk{color:var(--muted)}
.rv{font-weight:600;font-variant-numeric:tabular-nums}
.rm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.verdict{margin:0 0 10px;font-size:14px;line-height:1.75}
.rank{font-size:12px;color:var(--accent);font-weight:600}
.qr-box{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 0;
  border-top:1px solid var(--line)}
.qr-box img{width:84px;height:84px;display:block}
.qr-copy{font-size:12px;line-height:1.7}
.qr-copy span{color:var(--muted)}
.follow{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 0;
  border-top:1px solid var(--line)}
.follow img{width:84px;height:84px;display:block}
.follow div{font-size:12px;font-weight:600;line-height:1.7}
.follow span{font-weight:400;color:var(--muted)}
.share-btn{
  margin-top:16px;width:100%;appearance:none;border:1px solid var(--accent);
  background:transparent;color:var(--accent);padding:13px;font-size:14px;
  font-weight:600;font-family:inherit;cursor:pointer;
}
.card-wrap{margin-top:16px}
.card-wrap img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff}
.card-tip{margin:8px 0 6px;font-size:11px;color:var(--muted);text-align:center}
.card-dl{
  display:block;text-align:center;font-size:12px;color:var(--accent);
  text-decoration:none;padding:8px 0;
}
.again{
  margin-top:18px;width:100%;appearance:none;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);padding:13px;font-size:14px;
  font-weight:600;font-family:inherit;cursor:pointer;
}
.share{margin:12px 0 0;font-size:11.5px;color:var(--muted);text-align:center}

/* 页脚 */
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);line-height:1.8}
.foot p{margin:2px 0}

@media (max-width:420px){
  .head h1{font-size:30px}
  .r-nav{font-size:52px}
}
</style>
</head>

    });

    box.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="指数走势">' +
      '<polyline fill="none" stroke="#8A9099" stroke-width="1.6" points="' + pts + '"/>' +
      marks + '</svg>';
  }

  function renderStep() {
    var d = D.decisions[state.step];
    var last = state.step === D.decisions.length - 1;
    document.getElementById('step-label').textContent =
      '第 ' + (state.step + 1) + ' / ' + D.decisions.length + ' 步';
    document.getElementById('seg-label').textContent = d.date;
    document.getElementById('ask').textContent = d.ask;
    document.getElementById('hint').textContent = d.note;
    document.getElementById('feedback').textContent = '';
    var box = document.getElementById('opts');
    box.innerHTML = '';
    D.options.forEach(function (label, i) {
      var b = document.createElement('button');
      b.className = 'opt';
      b.textContent = label;
      b.addEventListener('click', function () { choose(i); });
      box.appendChild(b);
    });
    document.getElementById('play').hidden = false;
    document.getElementById('result').hidden = true;
  }

  function choose(i) {
    state.choices.push(i);
    var key = state.choices.join('') + new Array(D.decisions.length - state.choices.length + 1).join('0');
    var combo = D.combos[key];
    var seg = combo.segments[state.step];
    var fb = document.getElementById('feedback');
    fb.textContent = '这一段：' + signed(seg) + '（' + D.options[i] + '）';
    fb.className = 'feedback ' + (seg >= 0 ? 'up' : 'down');
    document.querySelectorAll('.opt').forEach(function (el) { el.disabled = true; });
    state.step += 1;
    if (state.step < D.decisions.length) {
      setTimeout(renderStep, 700);
    } else {
      setTimeout(showResult, 700);
    }
  }

  function showResult() {
    var key = state.choices.join('');
    var c = D.combos[key];
    var bh = D.buy_hold;
    document.getElementById('play').hidden = true;
    document.getElementById('result').hidden = false;
    document.getElementById('r-nav').textContent = c.nav.toFixed(2);
    document.getElementById('r-sub').textContent =
      '起始 1.00｜' + D.index_name + ' 同期 ' + bh.nav.toFixed(2);

    var rows = [
      ['你', c.nav, c.mdd],
      ['一直满仓', bh.nav, bh.mdd],
      ['一直空仓', D.combos['2'.repeat(D.decisions.length)].nav,
        D.combos['2'.repeat(D.decisions.length)].mdd]
    ];
    document.getElementById('r-rows').innerHTML = rows.map(function (r) {
      return '<div class="row"><span class="rk">' + r[0] + '</span>' +
        '<span class="rv">' + r[1].toFixed(2) + '</span>' +
        '<span class="rm">回撤 ' + pct(r[2]) + '</span></div>';
    }).join('');

    var label = function (i) {
      var p = D.decisions[i].date.split('-');
      return ' ' + parseInt(p[1], 10) + ' 月 ' + parseInt(p[2], 10) + ' 日';
    };
    var ev = [];
    state.choices.forEach(function (c, i) {
      if (i >= bh.segments.length) { return; }
      ev.push({ i: i, c: c, r: bh.segments[i] });
    });
    var avoided = ev.filter(function (e) { return e.c === 2 && e.r < 0; })
      .sort(function (a, b) { return a.r - b.r; })[0];
    var eaten = ev.filter(function (e) { return e.c === 0 && e.r < 0; })
      .sort(function (a, b) { return a.r - b.r; })[0];
    var missed = ev.filter(function (e) { return e.c === 2 && e.r > 0; })
      .sort(function (a, b) { return b.r - a.r; })[0];

    var v = '';
    if (avoided) {
      v = '你在' + label(avoided.i) + '之后清仓，躲过了 ' + signed(avoided.r) + ' 的下跌。';
    } else if (eaten) {
      v = '你在' + label(eaten.i) + '之后满仓，吃下了 ' + signed(eaten.r) + ' 的下跌。';
    } else {
      v = '你没有躲开主要下跌，期末净值 ' + c.nav.toFixed(2) + '。';
    }
    if (missed) {
      v += ' 但在' + label(missed.i) + '之后清仓，错过了 ' + signed(missed.r) + ' 的反弹。';
    }
    document.getElementById('r-verdict').textContent = v;
    lastCombo = c;
    lastVerdict = v;

    var beat = D.total_combos > 1
      ? ((D.total_combos - c.rank) / (D.total_combos - 1) * 100).toFixed(0) : '0';
    document.getElementById('r-rank').textContent =
      D.total_combos + ' 种选择里排第 ' + c.rank + '，击败了 ' + beat + '% 的可能。';
  }

  function wrapText(g, text, x, y, maxW, lh) {
    var line = '', lines = [];
    for (var i = 0; i < text.length; i++) {
      var t = line + text[i];
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = text[i]; }
      else { line = t; }
    }
    if (line) lines.push(line);
    lines.forEach(function (l, k) { g.fillText(l, x, y + k * lh); });
    return y + lines.length * lh;
  }

  function renderCard(c) {
    return new Promise(function (resolve) {
    var W = 1080, H = 1500, M = 76;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    var ink = '#14181C', muted = '#6E757D', accent = '#0B6E4F', line = 'rgba(20,24,28,.14)';

    g.fillStyle = '#FBFAF7'; g.fillRect(0, 0, W, H);
    g.textBaseline = 'alphabetic';

    g.fillStyle = muted; g.font = '400 24px "PingFang SC", sans-serif';
    g.fillText('历史决策实验', M, 96);

    g.fillStyle = ink; g.font = '600 82px "Songti SC", "Source Han Serif SC", serif';
    g.fillText('如果回到 ' + D.year, M, 200);

    g.fillStyle = muted; g.font = '400 28px "PingFang SC", sans-serif';
    g.fillText(D.subtitle, M, 252);

    g.strokeStyle = line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(M, 292); g.lineTo(W - M, 292); g.stroke();

    g.fillStyle = muted; g.font = '400 24px "PingFang SC", sans-serif';
    g.fillText('期末净值', M, 350);

    g.fillStyle = ink; g.font = '600 150px "Songti SC", "Source Han Serif SC", serif';
    g.fillText(c.nav.toFixed(2), M - 4, 500);

    var bh = D.buy_hold;
    g.fillStyle = muted; g.font = '400 28px "PingFang SC", sans-serif';
    g.fillText('起始 1.00｜' + D.index_name + ' 同期 ' + bh.nav.toFixed(2), M, 552);

    // 净值曲线
    var cx0 = M, cx1 = W - M, cy0 = 610, cy1 = 900;
    var n = D.series.length;
    var basePx = D.series[0][1];
    var idxNav = D.series.map(function (p) { return p[1] / basePx; });
    var mine = c.path.map(function (p) { return p[1]; });
    var all = idxNav.concat(mine);
    var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    var span = (mx - mn) || 1;
    var X = function (i) { return cx0 + (i / (n - 1)) * (cx1 - cx0); };
    var Y = function (v) { return cy1 - ((v - mn) / span) * (cy1 - cy0); };

    g.strokeStyle = line; g.setLineDash([6, 8]); g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx0, Y(1)); g.lineTo(cx1, Y(1)); g.stroke();
    g.setLineDash([]);

    g.strokeStyle = '#C2C7CC'; g.lineWidth = 2; g.beginPath();
    idxNav.forEach(function (v, i) { i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); });
    g.stroke();

    g.strokeStyle = accent; g.lineWidth = 4; g.lineJoin = 'round'; g.beginPath();
    mine.forEach(function (v, k) { var i = c.path[k][0]; k ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); });
    g.stroke();

    g.font = '400 22px "PingFang SC", sans-serif';
    g.fillStyle = accent; g.fillText('你的净值', cx1 - 210, cy0 - 12);
    g.fillStyle = '#9AA0A6'; g.fillText('沪深300', cx1 - 92, cy0 - 12);

    // 三行对比
    var cash = D.combos[new Array(D.decisions.length + 1).join('2')];
    var rows = [['你', c.nav, c.mdd], ['一直满仓', bh.nav, bh.mdd], ['一直空仓', cash.nav, cash.mdd]];
    g.font = '400 30px "PingFang SC", sans-serif';
    rows.forEach(function (r, i) {
      var y = 962 + i * 58;
      g.strokeStyle = line; g.beginPath(); g.moveTo(M, y + 16); g.lineTo(W - M, y + 16); g.stroke();
      g.fillStyle = muted; g.fillText(r[0], M, y);
      g.fillStyle = muted; g.font = '400 22px "PingFang SC", sans-serif';
      g.textAlign = 'right';
      g.fillText('回撤 ' + (r[2] * 100).toFixed(1) + '%', W - M - 130, y);
      g.fillStyle = ink; g.font = '600 34px "PingFang SC", sans-serif';
      g.fillText(r[1].toFixed(2), W - M, y);
      g.textAlign = 'left';
      g.font = '400 30px "PingFang SC", sans-serif';
    });

    // 结论
    g.fillStyle = ink; g.font = '400 36px "PingFang SC", sans-serif';
    var vy = wrapText(g, lastVerdict, M, 1146, W - 2 * M, 56);

    g.fillStyle = accent; g.font = '600 30px "PingFang SC", sans-serif';
    g.fillText(D.total_combos + ' 种选择里排第 ' + c.rank + '，击败了 ' +
      ((D.total_combos - c.rank) / (D.total_combos - 1) * 100).toFixed(0) + '% 的可能。', M, vy + 54);

    g.fillStyle = muted; g.font = '400 22px "PingFang SC", sans-serif';
    wrapText(g, D.disclaimer, M, 1372, W - 2 * M, 34);

    g.fillStyle = '#9AA0A6'; g.font = '400 21px "PingFang SC", sans-serif';
    g.fillText('武占国的AI助理 · 市场观察', M, 1452);

    var qs = 128, qx = W - M - qs, qy = 344;
    g.fillStyle = '#FFFFFF'; g.fillRect(qx - 10, qy - 10, qs + 20, qs + 20);
    g.strokeStyle = line; g.strokeRect(qx - 10, qy - 10, qs + 20, qs + 20);
    g.fillStyle = muted; g.font = '400 20px "PingFang SC", sans-serif';
    g.textAlign = 'center';
    g.fillText('扫码玩同款', qx + qs / 2, qy + qs + 36);
    g.textAlign = 'left';

    var qimg = new Image();
    qimg.onload = function () {
      g.drawImage(qimg, qx, qy, qs, qs);
      resolve(cv.toDataURL('image/png'));
    };
    qimg.onerror = function () { resolve(cv.toDataURL('image/png')); };
    qimg.src = D.qr;
    });
  }

  document.getElementById('make-card').addEventListener('click', function () {
    if (!lastCombo) { return; }
    var btn = this;
    btn.disabled = true;
    renderCard(lastCombo).then(function (url) {
      document.getElementById('card-img').src = url;
      document.getElementById('card-dl').href = url;
      document.getElementById('card-wrap').hidden = false;
      btn.hidden = true;
      document.getElementById('card-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  document.getElementById('again').addEventListener('click', function () {
    state = { step: 0, choices: [] };
    lastCombo = null; lastVerdict = '';
    document.getElementById('card-wrap').hidden = true;
    document.getElementById('make-card').hidden = false;
    document.getElementById('card-img').src = '';
    renderStep();
  });

  drawChart();
  renderStep();
})();
</script>
</body>
</html>
